<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">Sanad Alrigee - Netrunner and full-stack developer</title>
  <desc id="d">Neon cyberpunk banner with the name Sanad Alrigee, the role Full-Stack Dev, and an online status line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#160a28"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F2FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00F2FF" stroke-opacity=".08"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".28"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'Courier New', ui-monospace, Menlo, Consolas, monospace; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .glitch { animation: glitch 4s infinite; }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0, 0); }
      92% { transform: translate(-5px, 1px); }
      94% { transform: translate(4px, -1px); }
      96% { transform: translate(-2px, 0); }
    }
    .sweep { animation: sweep 6s linear infinite; }
    @keyframes sweep { from { transform: translateY(-12px); } to { transform: translateY(272px); } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .blink, .glitch, .sweep, .pulse { animation: none; }
    }
  </style>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#00F2FF" stroke-width="2" stroke-linecap="square">
    <path d="M18 52V18H52"/>
    <path d="M848 18H882V52"/>
    <path d="M18 208V242H52"/>
    <path d="M882 208V242H848"/>
  </g>

  <!-- top status strip -->
  <g class="mono" font-size="13" letter-spacing="2">
    <text x="64" y="38" fill="#8A9BB5">// NEURAL LINK v2.0</text>
    <circle class="pulse" cx="700" cy="33" r="5" fill="#00FF41" filter="url(#glow)"/>
    <text x="714" y="38" fill="#00FF41">ONLINE</text>
  </g>

  <!-- title with chromatic offset -->
  <g class="mono" font-size="62" font-weight="700" letter-spacing="6" text-anchor="middle">
    <text class="glitch" x="446" y="124" fill="#FF2BD6" fill-opacity=".85">SANAD ALRIGEE</text>
    <text class="glitch" x="454" y="120" fill="#00F2FF" fill-opacity=".85" style="animation-delay:.05s">SANAD ALRIGEE</text>
    <text x="450" y="122" fill="#F4FAFF" filter="url(#glow)">SANAD ALRIGEE</text>
  </g>

  <!-- subtitle -->
  <g class="mono" text-anchor="middle">
    <text x="450" y="168" font-size="20" letter-spacing="7" fill="#00F2FF">NETRUNNER / FULL-STACK DEV</text>
    <text x="450" y="204" font-size="14" letter-spacing="3" fill="#8A9BB5">&gt; building tools that ship<tspan class="blink" fill="#00FF41">_</tspan></text>
  </g>

  <!-- bottom edge -->
  <rect x="64" y="226" width="772" height="2" fill="url(#edge)" filter="url(#glow)"/>

  <!-- sweep line + scanlines -->
  <rect class="sweep" x="0" y="0" width="900" height="3" fill="#00F2FF" fill-opacity=".12"/>
  <rect width="900" height="260" fill="url(#scan)"/>
  <rect x=".5" y=".5" width="899" height="259" fill="none" stroke="url(#edge)" stroke-opacity=".6"/>
</svg>
